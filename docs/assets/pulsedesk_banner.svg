<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Blue Brand Gradient -->
    <linearGradient id="blue-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Subtle Glow Accents -->
    <radialGradient id="glow-blue" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#93C5FD" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-emerald" cx="20%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Micro Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2E8F0" stroke-width="0.75" stroke-opacity="0.7"/>
    </pattern>

    <!-- Card Shadow -->
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glow-blue)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glow-emerald)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- LEFT SECTION: Brand Identity & Typography -->
  <g transform="translate(80, 60)">
    <!-- Brand Icon -->
    <rect width="56" height="56" rx="16" fill="url(#blue-brand)" filter="url(#card-shadow)"/>
    <path d="M 44 28 L 36 28 L 30 42 L 20 14 L 14 28 L 8 28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- PulseDesk AI Title -->
    <text x="76" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">
      PulseDesk <tspan fill="#2563EB">AI</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1E293B" letter-spacing="-0.02em">
      Your workspace. Connected. Remembered. Understood.
    </text>

    <!-- Subtitle / Architecture summary -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#64748B" letter-spacing="-0.01em">
      An intelligent Agentic RAG workspace combining live tool conduits, persistent cross-thread memory,
    </text>
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#64748B" letter-spacing="-0.01em">
      LangGraph orchestration, and deterministic AST-grounded citation verification.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: LangGraph -->
      <g>
        <rect width="170" height="32" rx="16" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#2563EB"/>
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#1D4ED8">LangGraph 7-Stage</text>
      </g>

      <!-- Pill 2: Model Context Protocol -->
      <g transform="translate(180, 0)">
        <rect width="185" height="32" rx="16" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#16A34A"/>
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#15803D">MCP 2.x Stdio Conduits</text>
      </g>

      <!-- Pill 3: AST Grounded Citations -->
      <g transform="translate(375, 0)">
        <rect width="195" height="32" rx="16" fill="#FAF5FF" stroke="#F3E8FF" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#9333EA"/>
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#7E22CE">AST Citation Verification</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SECTION: Visual Feature Badges & Telemetry Cards -->
  <g transform="translate(730, 48)">
    <!-- Card 1: Live Status -->
    <g filter="url(#card-shadow)">
      <rect width="390" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="18" y="18" width="38" height="38" rx="10" fill="#FEF2F2"/>
      <!-- Alert Triangle Icon -->
      <path d="M 37 27 L 47 45 L 27 45 Z" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="37" cy="40" r="1" fill="#EF4444"/>
      <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#991B1B" text-transform="uppercase" letter-spacing="0.05em">Grounded Blocker Detection</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="500" fill="#1E293B">Issue #42: Stripe HMAC mismatch in staging</text>
    </g>

    <!-- Card 2: Connected Sources -->
    <g transform="translate(0, 88)" filter="url(#card-shadow)">
      <rect width="390" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="18" y="18" width="38" height="38" rx="10" fill="#EFF6FF"/>
      <!-- Connected Conduit Icon -->
      <circle cx="37" cy="37" r="8" fill="none" stroke="#2563EB" stroke-width="2"/>
      <circle cx="37" cy="37" r="3" fill="#2563EB"/>
      <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#1E40AF" text-transform="uppercase" letter-spacing="0.05em">Multi-Conduit Integration</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="500" fill="#1E293B">GitHub MCP (2 repos) · Gmail · Linear</text>
    </g>

    <!-- Card 3: AST Citation & Verified Answer -->
    <g transform="translate(0, 176)" filter="url(#card-shadow)">
      <rect width="390" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="18" y="18" width="38" height="38" rx="10" fill="#F0FDF4"/>
      <!-- Check Shield Icon -->
      <path d="M 37 26 L 47 30 V 38 C 47 44 42 48 37 50 C 32 48 27 44 27 38 V 30 Z" fill="none" stroke="#16A34A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 33 38 L 36 41 L 42 35" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#166534" text-transform="uppercase" letter-spacing="0.05em">Zero-Hallucination Gating</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="500" fill="#1E293B">Claims strictly verified against evidence IDs [1..4]</text>
    </g>
  </g>
</svg>
