<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051214"/>
      <stop offset="45%" stop-color="#0B2224"/>
      <stop offset="100%" stop-color="#081A1C"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#93D4D8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#336269" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B2224" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-coral" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#941D1D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B2224" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Accent Gradients -->
    <linearGradient id="aqua-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93D4D8"/>
      <stop offset="100%" stop-color="#5EAEB4"/>
    </linearGradient>
    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93D4D8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#336269" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#336269" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bg-grad)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow-teal)"/>
  <rect width="1200" height="340" fill="url(#glow-coral)"/>

  <!-- Subtle Outer Border -->
  <rect x="1" y="1" width="1198" height="338" rx="16" fill="none" stroke="#336269" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Left: Brand Emblem & Visual Pulse Network -->
  <g transform="translate(80, 75)">
    <!-- Node Network Graphics -->
    <path d="M 35 45 L 85 20 L 135 60 L 85 110 Z" fill="none" stroke="#336269" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M 85 20 L 85 110" fill="none" stroke="#93D4D8" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 3"/>
    <path d="M 35 45 L 135 60" fill="none" stroke="#93D4D8" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Glowing Nodes -->
    <circle cx="85" cy="20" r="7" fill="#0B2224" stroke="#93D4D8" stroke-width="2.5"/>
    <circle cx="85" cy="20" r="3" fill="#93D4D8"/>

    <circle cx="35" cy="45" r="6" fill="#0B2224" stroke="#5EAEB4" stroke-width="2"/>
    <circle cx="35" cy="45" r="2.5" fill="#5EAEB4"/>

    <circle cx="135" cy="60" r="6" fill="#0B2224" stroke="#941D1D" stroke-width="2"/>
    <circle cx="135" cy="60" r="2.5" fill="#FF8A8A"/>

    <circle cx="85" cy="110" r="8" fill="#0B2224" stroke="#93D4D8" stroke-width="3"/>
    <circle cx="85" cy="110" r="3.5" fill="#93D4D8"/>
  </g>

  <!-- Center-Left: Main Typography -->
  <g transform="translate(250, 75)">
    <!-- Top Pill: Status & Architecture -->
    <rect x="0" y="0" width="270" height="26" rx="13" fill="#0E2D30" stroke="url(#badge-border)" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#93D4D8"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#93D4D8" letter-spacing="1">AGENTIC RAG WORKSPACE</text>
    <text x="180" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#69969C">· MCP 2.x</text>

    <!-- Main Title -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#F0FDFE" letter-spacing="-1">PulseDesk AI</text>

    <!-- Tagline -->
    <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="#93D4D8">Your workspace. Connected. Remembered. Understood.</text>

    <!-- Subtitle description -->
    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#A0C9CC">
      Evidence-grounded workspace reasoning across dynamic GitHub MCP tools, Gmail OAuth, and durable memory.
    </text>

    <!-- Capabilities Strip -->
    <g transform="translate(0, 165)">
      <!-- Badge 1: LangGraph -->
      <rect x="0" y="0" width="138" height="26" rx="6" fill="#06181A" stroke="#336269" stroke-width="1"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#F0FDFE">LangGraph 7-Stage</text>

      <!-- Badge 2: Model Context Protocol -->
      <rect x="148" y="0" width="132" height="26" rx="6" fill="#06181A" stroke="#336269" stroke-width="1"/>
      <text x="160" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#F0FDFE">MCP Stdio Protocol</text>

      <!-- Badge 3: Provenance Citations -->
      <rect x="290" y="0" width="144" height="26" rx="6" fill="#06181A" stroke="#336269" stroke-width="1"/>
      <text x="302" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#F0FDFE">Verified Citations</text>

      <!-- Badge 4: Durable Memory -->
      <rect x="444" y="0" width="148" height="26" rx="6" fill="#06181A" stroke="#336269" stroke-width="1"/>
      <text x="456" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#F0FDFE">PostgreSQL Memory</text>
    </g>
  </g>

  <!-- Right Decorative Telemetry Node Graphic -->
  <g transform="translate(940, 80)">
    <rect width="180" height="170" rx="12" fill="#081E21" stroke="#336269" stroke-width="1" stroke-opacity="0.6"/>
    <rect x="12" y="14" width="70" height="18" rx="4" fill="#06181A" stroke="#336269" stroke-width="0.8"/>
    <text x="18" y="27" font-family="monospace" font-size="9" fill="#93D4D8">LIVE TOPO</text>

    <!-- Mini topology lines -->
    <path d="M 30 65 L 75 90 L 130 65" fill="none" stroke="#336269" stroke-width="1.5"/>
    <path d="M 75 90 L 75 140" fill="none" stroke="#941D1D" stroke-width="1.5" stroke-dasharray="2 2"/>

    <circle cx="30" cy="65" r="5" fill="#0B2224" stroke="#93D4D8" stroke-width="2"/>
    <circle cx="130" cy="65" r="5" fill="#0B2224" stroke="#93D4D8" stroke-width="2"/>
    <circle cx="75" cy="90" r="6" fill="#0B2224" stroke="#941D1D" stroke-width="2"/>
    <circle cx="75" cy="140" r="5" fill="#0B2224" stroke="#FF8A8A" stroke-width="2"/>

    <text x="16" y="156" font-family="monospace" font-size="9" fill="#A0C9CC">Stripe HMAC #42</text>
  </g>
</svg>
